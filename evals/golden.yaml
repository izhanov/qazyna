# Golden set for `qazyna eval`: real queries and the files that count as
# a correct answer (path suffix match, file-level — see docs/eval.md).
# Every time search performs poorly in daily use, the query goes here.

- query: "что мы должны сделать чтобы подготовить тикет для деплоя?"
  expect: ["kit-help/resources/help-text.md"]

- query: "как задеплоить на препрод"
  expect: ["skills/deploy/SKILL.md", "infra-deploy-preprod/SKILL.md"]

- query: 'how we could improve semantic search and indexing -"evil martians"'
  expect: ["docs/eval.en.md"]

- query: "как измерять качество поиска recall MRR"
  expect: ["docs/eval.md", "docs/eval.en.md"]
